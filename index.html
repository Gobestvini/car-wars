<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#ecece6" />
    <title>CarWars</title>
  </head>
  <body>
    <canvas id="scene" aria-label="Площадка для управления машиной"></canvas>
    <div id="speedometer" aria-label="Скорость машины"><span id="speed">0</span> <span class="speed-unit">км/ч</span></div>
    <button id="settings-button" class="icon-button" type="button" aria-label="Настройки" title="Настройки" aria-controls="settings" aria-expanded="false">⚙</button>
    <section id="settings" class="panel" aria-label="Настройки автомобиля" hidden inert>
      <div id="settings-controls"></div>
    </section>
    <div id="load-status" role="status">Загрузка машины…</div>
    <button id="retry-load" type="button" hidden>Повторить загрузку</button>
    <pre id="performance" hidden></pre>
    <div id="touch-marker" aria-hidden="true"><span></span></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
