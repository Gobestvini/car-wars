name: carwars-preview
services:
  multiplayer:
    image: carwars-preview:${CARWARS_RELEASE:?Set CARWARS_RELEASE}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      edge:
        aliases: [carwars-multiplayer]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
networks:
  edge:
    external: true
    name: tower-edge
