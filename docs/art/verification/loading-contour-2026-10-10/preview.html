<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading contour check</title>
<link rel="stylesheet" href="/src/loading-screen.css">
<style>body{box-sizing:border-box;padding:32px;background:#163b65;color:#fff9ec;font:800 17px 'Car Roboto',sans-serif}main{max-width:520px;margin:auto}.loading-progress{margin:12px 0 24px}.loading-fill{transition:none}.loading-fill::after{animation:none;opacity:0}h1{font:32px 'Lilita One',sans-serif}</style>
<main><h1>GET READY TO RACE</h1>
<label>2%<div class="loading-progress"><div class="loading-fill" style="width:2%"></div></div></label>
<label>50%<div class="loading-progress"><div class="loading-fill" style="width:50%"></div></div></label>
<label>100%<div class="loading-progress"><div class="loading-fill" style="width:100%"></div></div></label>
</main></html>
